# Replaces nginx:alpine's stock /etc/nginx/nginx.conf. The stock one writes
# its pid and temp dirs under paths owned by root and assumes it can
# setuid from root to the `nginx` user at startup. This container runs AS
# `nginx` from the start (Dockerfile USER) with no writable root filesystem
# guaranteed anywhere: even /tmp is only writable if it happens to be part of
# a writable root fs, which a `readOnlyRootFilesystem` pod policy removes with
# no separate volume required to restore it. /dev/shm is a tmpfs the
# container runtime mounts in addition to the root filesystem — present and
# writable (mode 1777) whether or not the root fs itself is read-only — so
# every path nginx writes to, including the rendered server block
# 15-aep-api-proxy.sh produces at startup (see conf.d include below), lives
# there instead.
worker_processes auto;
pid /dev/shm/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path       /dev/shm/proxy_temp;
    fastcgi_temp_path     /dev/shm/fastcgi_temp;
    uwsgi_temp_path       /dev/shm/uwsgi_temp;
    scgi_temp_path        /dev/shm/scgi_temp;

    include /dev/shm/nginx/conf.d/*.conf;
}
