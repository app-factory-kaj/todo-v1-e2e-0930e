# Replaces nginx:alpine's stock /etc/nginx/nginx.conf. The stock one writes
# its pid and temp dirs under paths owned by root and assumes it can
# setuid from root to the `nginx` user at startup. This container runs AS
# `nginx` from the start (Dockerfile USER) with no writable root filesystem
# guaranteed outside /tmp, so every path nginx writes to lives under /tmp —
# including the rendered server block 15-aep-api-proxy.sh produces at
# startup (see conf.d include below).
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /tmp/nginx/conf.d/*.conf;
}
